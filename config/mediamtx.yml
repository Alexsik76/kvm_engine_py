#logLevel: debug
authInternalUsers:
  - user: admin
    pass: password
    permissions:
      - action: read
        path: kvm
      - action: publish
        path: kvm
webrtc: true

# For external access and dstnat udp port 30000 on the router
# webrtcAdditionalHosts: ["79.143.43.173"]

# local config
webrtcLocalUDPAddress: :30000
webrtcIPsFromInterfaces: yes
webrtcIPsFromInterfacesList: [eth0]
# webrtcICEServers2:
#   - url: stun:stun.l.google.com:19302
#   - url: stun:stun1.l.google.com:19302

paths:
  kvm:
    runOnDemand: /home/alex/kvm_engine_py/start_ffmpeg.sh
    runOnDemandStartTimeout: 10s
    runOnDemandCloseAfter: 10s
    runOnDemandRestart: true
    # alwaysAvailable: true
    #alwaysAvailableTracks:
    #  - codec: H264
